name: Daily Dependency Check

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deps-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DepsCheck
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup GitHub CLI auth (cross-repo access)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: gh auth status

      - name: Clone client repos
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: bash scripts/clone-clients.sh workspace

      - name: Scan dependencies
        run: node scripts/scan-deps.mjs workspace > reports/latest-scan.json

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Research fixes with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat prompts/research.md)" --dangerously-skip-permissions

      - name: Commit report
        run: |
          git config user.name "depscheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily dependency report $(date +%F)"
            git push
          fi
